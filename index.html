    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
          },
          colors: {
            primary: '#0ea5e9',
            neon: '#22d3ee',
            dark: '#0f172a',
          },
          boxShadow: {
            'neon': '0 0 5px theme("colors.neon"), 0 0 20px theme("colors.neon")',
            'neon-strong': '0 0 10px theme("colors.neon"), 0 0 40px theme("colors.neon")',
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulse-neon {

      0%,
      100% {
        opacity: 1;
        text-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee;
      }

      50% {
        opacity: 0.8;
        text-shadow: 0 0 2px #22d3ee, 0 0 5px #22d3ee;
      }
    }

    .neon-text {
      animation: pulse-neon 2s infinite;
    }

    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
